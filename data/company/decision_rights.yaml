# Bảng thẩm quyền ra quyết định (được rút ra từ policies/decision_policy.md).
# mode=authority: phải có người thuộc `roles` chốt hoặc xác nhận.
# mode=consensus: cả nhóm đồng thuận (>= nửa số người dự, tối thiểu 2), không cần vai trò đặc biệt.
categories:
  scope:     {mode: authority, roles: [pm, head_of_product]}
  technical: {mode: authority, roles: [tech_lead, pm]}
  design:    {mode: authority, roles: [design_lead, head_of_product]}
  budget:    {mode: authority, roles: [head_of_product, finance]}
  release:   {mode: authority, roles: [head_of_product]}
  process:   {mode: consensus, roles: []}
  other:     {mode: consensus, roles: []}
